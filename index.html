<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Badminton Apps</title>
<meta name="description" content="バドミントンの練習・試合・ルール確認に使えるアプリ集（ErrorZero / RallyScore / PairPlay / Shatomin）">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" sizes="180x180" href="icons/rallyscore-icon-180.png">
<style>
:root{
  --bg:#0f172a; --card:#111c33; --line:#1e2a44; --text:#e2e8f0; --muted:#94a3b8;
  --accent:#22c55e;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f8fafc; --card:#ffffff; --line:#e2e8f0; --text:#0f172a; --muted:#64748b; --accent:#16a34a; }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  line-height:1.6;
}
main{max-width:880px; margin:0 auto; padding:40px 16px 56px}
header h1{margin:0; font-size:28px; letter-spacing:.02em}
header p{margin:6px 0 0; color:var(--muted); font-size:14px}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; margin-top:28px}
a.card{
  display:flex; flex-direction:column; gap:6px; padding:18px; border-radius:16px;
  background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none;
  transition:transform .12s ease, border-color .12s ease;
}
a.card:hover, a.card:focus-visible{transform:translateY(-2px); border-color:var(--accent); outline:none}
.top{display:flex; align-items:center; gap:12px}
.icon{width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:24px; background:var(--line); overflow:hidden; flex:none}
.icon img{width:100%; height:100%; object-fit:cover}
.name{font-weight:700; font-size:18px}
.ver{font-size:12px; color:var(--muted)}
.desc{font-size:14px; color:var(--muted)}
footer{margin-top:36px; font-size:12px; color:var(--muted)}
</style>
</head>
<body>
<main>
  <header>
    <h1>🏸 Badminton Apps</h1>
    <p>練習・試合運営・スコア・ルール確認のためのアプリ集</p>
  </header>

  <div class="grid">
    <a class="card" href="PairPlay/">
      <div class="top">
        <div class="icon"><img src="icons/pairplay-icon-180.png" alt=""></div>
        <div><div class="name">PairPlay</div><div class="ver">v1.5.0</div></div>
      </div>
      <div class="desc">参加者からダブルスの組み合わせとコート割りを自動作成。RallyScore と連携できます。</div>
    </a>

    <a class="card" href="RallyScore/">
      <div class="top">
        <div class="icon"><img src="icons/rallyscore-icon-180.png" alt=""></div>
        <div><div class="name">RallyScore</div><div class="ver">v2.1.3</div></div>
      </div>
      <div class="desc">試合用スコアボード。サーブ表示・デュース・コートチェンジに対応。</div>
    </a>

    <a class="card" href="ErrorZero/">
      <div class="top">
        <div class="icon">🎯</div>
        <div><div class="name">ErrorZero</div><div class="ver">v1.0.4</div></div>
      </div>
      <div class="desc">全ポイントを記録し、ミスの傾向をライブで分析するスコアシート。</div>
    </a>

    <a class="card" href="Shatomin/">
      <div class="top">
        <div class="icon">📘</div>
        <div><div class="name">Shatomin</div><div class="ver">v1.0.5</div></div>
      </div>
      <div class="desc">バドミントンのルールを気軽に確認できる Rule Buddy。</div>
    </a>
  </div>

  <footer>aohaus.github.io/Badminton</footer>
</main>
</body>
</html>
